# Pre-commit hooks. Install: pip install pre-commit && pre-commit install
# Pre-push (run tests): pre-commit install --hook-type pre-push

repos:
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: backend/.venv/bin/python -m pytest -q
        language: system
        pass_filenames: false
        stages: [push]
